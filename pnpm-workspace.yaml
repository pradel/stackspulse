packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  "@vitest/coverage-v8": 4.1.11

minimumReleaseAgeExclude:
  - stacksindex@0.1.0
  - effect@4.0.0
  - drizzle-orm@1.0.0-rc.5-5935859
  - drizzle-kit@1.0.0-rc.5-5935859
  - zod@4.6.2

overrides:
  vite@*: "catalog:"
  # @effect/platform-node 4.0.2 accepts ^4.0.2, but 4.0.5 needs effect 4.0.5;
  # stacksindex pins effect 4.0.2, and two effect copies break service identity.
  "@effect/platform-node-shared": 4.0.2
  # recharts 2 unwraps children with react-is; 18.x does not recognize React 19
  # elements, so fragment-wrapped series (Tremor AreaChart) never render.
  "recharts>react-is": 19.3.1
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
